openapi: 3.0.3
info:
  title: Notes API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/notes:
    get:
      summary: List notes
      responses:
        '200':
          description: Notes ordered by ID
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Note' }
    post:
      summary: Create note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNote' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/notes/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      summary: Get note
      responses:
        '200':
          description: Note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update title or content
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchNote' }
      responses:
        '200':
          description: Updated note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete note
      responses:
        '204': { description: Deleted, no body }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  schemas:
    CreateNote:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        content: { type: string }
    PatchNote:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        content: { type: string }
    Note:
      type: object
      required: [id, title, content, createdAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Note missing
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
